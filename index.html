<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Scaler</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background: #111;
        color: white;
        font-family: Arial, sans-serif;
        padding: 25px;
    }

    .container {
        max-width: 850px;
        margin: auto;
        background: #202020;
        padding: 25px;
        border-radius: 18px;
    }

    h1 {
        text-align: center;
    }

    .controls {
        display: grid;
        gap: 15px;
        margin-top: 25px;
    }

    .row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
    }

    label {
        font-weight: bold;
    }

    input[type="number"] {
        width: 100px;
        padding: 9px;
        border: 0;
        border-radius: 7px;
        font-size: 16px;
    }

    button,
    .download {
        border: 0;
        border-radius: 8px;
        padding: 10px 16px;
        font-weight: bold;
        cursor: pointer;
        background: white;
        color: black;
        text-decoration: none;
    }

    button:hover,
    .download:hover {
        background: #ddd;
    }

    .mode {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
    }

    .mode button.active {
        background: #888;
        color: white;
    }

    .preview {
        margin-top: 25px;
        padding: 20px;
        border-radius: 12px;
        overflow: auto;

        background:
            repeating-conic-gradient(
                #333 0% 25%,
                #222 0% 50%
            ) 50% / 20px 20px;

        text-align: center;
    }

    canvas {
        max-width: 100%;
        height: auto;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        border: 2px solid white;
    }

    #download {
        display: none;
        margin-top: 20px;
    }

    #info {
        color: #bbb;
        margin-top: 10px;
    }
</style>
</head>

<body>

<div class="container">

    <h1>🖼️ Pixel Scaler</h1>

    <div class="controls">

        <div class="row">
            <input
                type="file"
                id="imageInput"
                accept="image/png,image/jpeg,image/webp"
            >
        </div>

        <div class="row">
            <label>Mode:</label>

            <div class="mode">
                <button id="scaleMode" class="active">
                    Pixel Scale
                </button>

                <button id="resolutionMode">
                    Final Resolution
                </button>
            </div>
        </div>

        <!-- PIXEL SCALE CONTROLS -->

        <div id="scaleControls">

            <div class="row">

                <label>
                    X:
                    <input
                        type="number"
                        id="scaleX"
                        value="2"
                        min="1"
                        max="100"
                    >
                </label>

                <label>
                    Y:
                    <input
                        type="number"
                        id="scaleY"
                        value="2"
                        min="1"
                        max="100"
                    >
                </label>

                <label>
                    <input
                        type="checkbox"
                        id="lockXY"
                        checked
                    >
                    X = Y
                </label>

            </div>

        </div>


        <!-- FINAL RESOLUTION CONTROLS -->

        <div id="resolutionControls" style="display:none">

            <div class="row">

                <label>
                    Width:
                    <input
                        type="number"
                        id="finalWidth"
                        value="128"
                        min="1"
                        max="4096"
                    >
                </label>

                <label>
                    Height:
                    <input
                        type="number"
                        id="finalHeight"
                        value="128"
                        min="1"
                        max="4096"
                    >
                </label>

                <label>
                    <input
                        type="checkbox"
                        id="lockResolution"
                        checked
                    >
                    X = Y
                </label>

            </div>

        </div>


        <div class="row">

            <button id="applyButton">
                Apply
            </button>

            <button id="resetButton">
                Reset
            </button>

        </div>

    </div>

    <div id="info">
        No image loaded
    </div>

    <div class="preview">
        <canvas id="canvas"></canvas>
    </div>

    <a
        id="download"
        class="download"
        download="pixel_image.png"
    >
        ⬇️ Download PNG
    </a>

</div>


<script>

const imageInput = document.getElementById("imageInput");

const scaleX = document.getElementById("scaleX");
const scaleY = document.getElementById("scaleY");

const finalWidth = document.getElementById("finalWidth");
const finalHeight = document.getElementById("finalHeight");

const lockXY = document.getElementById("lockXY");
const lockResolution = document.getElementById("lockResolution");

const scaleMode = document.getElementById("scaleMode");
const resolutionMode = document.getElementById("resolutionMode");

const scaleControls = document.getElementById("scaleControls");
const resolutionControls = document.getElementById("resolutionControls");

const applyButton = document.getElementById("applyButton");
const resetButton = document.getElementById("resetButton");

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const info = document.getElementById("info");
const download = document.getElementById("download");

let image = null;
let imageURL = null;

let currentMode = "scale";


// --------------------------------
// IMAGE LOADING
// --------------------------------

imageInput.addEventListener("change", () => {

    const file = imageInput.files[0];

    if (!file) return;

    if (imageURL) {
        URL.revokeObjectURL(imageURL);
    }

    imageURL = URL.createObjectURL(file);

    const img = new Image();

    img.onload = () => {

        image = img;

        info.textContent =
            `Original: ${img.naturalWidth} × ${img.naturalHeight} pixels`;

        apply();

    };

    img.onerror = () => {
        alert("Could not load this image.");
    };

    img.src = imageURL;
});


// --------------------------------
// MODE BUTTONS
// --------------------------------

scaleMode.addEventListener("click", () => {

    currentMode = "scale";

    scaleMode.classList.add("active");
    resolutionMode.classList.remove("active");

    scaleControls.style.display = "block";
    resolutionControls.style.display = "none";

});


resolutionMode.addEventListener("click", () => {

    currentMode = "resolution";

    resolutionMode.classList.add("active");
    scaleMode.classList.remove("active");

    scaleControls.style.display = "none";
    resolutionControls.style.display = "block";

});


// --------------------------------
// X = Y FOR SCALE
// --------------------------------

scaleX.addEventListener("input", () => {

    if (lockXY.checked) {
        scaleY.value = scaleX.value;
    }

});

scaleY.addEventListener("input", () => {

    if (lockXY.checked) {
        scaleX.value = scaleY.value;
    }

});


// --------------------------------
// X = Y FOR RESOLUTION
// --------------------------------

finalWidth.addEventListener("input", () => {

    if (lockResolution.checked) {
        finalHeight.value = finalWidth.value;
    }

});

finalHeight.addEventListener("input", () => {

    if (lockResolution.checked) {
        finalWidth.value = finalHeight.value;
    }

});


// --------------------------------
// APPLY
// --------------------------------

applyButton.addEventListener("click", apply);


function apply() {

    if (!image) {

        if (imageInput.files.length === 0) {
            return;
        }

        return;
    }


    if (currentMode === "scale") {

        let sx = parseInt(scaleX.value);
        let sy = parseInt(scaleY.value);

        sx = Math.max(1, Math.min(100, sx));
        sy = Math.max(1, Math.min(100, sy));

        scaleX.value = sx;
        scaleY.value = sy;


        /*
            IMPORTANT:

            We first reduce the image to its pixel-art
            resolution.

            Example:

            Original = 800 × 600
            Scale = 4

            Pixel-art size becomes:

            200 × 150

            Then EVERY pixel is repeated 4 × 4.

            This gives real pixel blocks instead
            of simply stretching the image.
        */

        const smallCanvas = document.createElement("canvas");

        const smallWidth =
            Math.max(1, Math.floor(image.naturalWidth / sx));

        const smallHeight =
            Math.max(1, Math.floor(image.naturalHeight / sy));

        smallCanvas.width = smallWidth;
        smallCanvas.height = smallHeight;

        const smallCtx = smallCanvas.getContext("2d");

        smallCtx.imageSmoothingEnabled = false;

        smallCtx.drawImage(
            image,
            0,
            0,
            smallWidth,
            smallHeight
        );


        // Final image

        canvas.width = smallWidth * sx;
        canvas.height = smallHeight * sy;

        ctx.imageSmoothingEnabled = false;

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        // Every pixel is repeated
        ctx.drawImage(
            smallCanvas,
            0,
            0,
            canvas.width,
            canvas.height
        );


        info.textContent =
            `Pixel scale: ${sx} × ${sy} | Final: ${canvas.width} × ${canvas.height}`;

    }


    else {

        let width = parseInt(finalWidth.value);
        let height = parseInt(finalHeight.value);

        width = Math.max(1, Math.min(4096, width));
        height = Math.max(1, Math.min(4096, height));

        finalWidth.value = width;
        finalHeight.value = height;


        canvas.width = width;
        canvas.height = height;

        ctx.imageSmoothingEnabled = false;

        ctx.clearRect(
            0,
            0,
            width,
            height
        );

        ctx.drawImage(
            image,
            0,
            0,
            width,
            height
        );


        info.textContent =
            `Final resolution: ${width} × ${height}`;

    }


    updateDownload();
}


// --------------------------------
// DOWNLOAD
// --------------------------------

function updateDownload() {

    canvas.toBlob(blob => {

        if (!blob) return;

        if (download.dataset.url) {
            URL.revokeObjectURL(download.dataset.url);
        }

        const url = URL.createObjectURL(blob);

        download.href = url;
        download.dataset.url = url;

        download.style.display = "inline-block";

    }, "image/png");

}


// --------------------------------
// RESET
// --------------------------------

resetButton.addEventListener("click", () => {

    scaleX.value = 2;
    scaleY.value = 2;

    finalWidth.value = 128;
    finalHeight.value = 128;

    lockXY.checked = true;
    lockResolution.checked = true;

    canvas.width = 0;
    canvas.height = 0;

    download.style.display = "none";

    info.textContent =
        image
        ? `Original: ${image.naturalWidth} × ${image.naturalHeight} pixels`
        : "No image loaded";

});

</script>

</body>
</html>
